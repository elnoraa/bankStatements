services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Australia/Sydney
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - db
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  clamav:
    image: clamav/clamav:stable
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-db:/var/lib/clamav
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      RABBITMQ_DEFINITIONS_FILE: /etc/rabbitmq/definitions.json
      RABBITMQ_LOAD_DEFINITIONS: true
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    restart: unless-stopped

  test-unit:
    build:
      context: ./backend
      target: test

  test-integration:
    build:
      context: ./backend
      target: test-integration
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - TESTCONTAINERS_RYUK_DISABLED=true

  backend:
    build:
      context: ./backend
      target: runtime
    ports:
      - "127.0.0.1:5213:5213"
    depends_on:
      test-unit:
        condition: service_completed_successfully
      db:
        condition: service_started
      clamav:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      - Jwt__Issuer=${Jwt__Issuer}
      - Jwt__Audience=${Jwt__Audience}
      - Jwt__Secret=${Jwt__Secret}
      - Jwt__AccessTokenMinutes=${Jwt__AccessTokenMinutes}
      - Jwt__RefreshTokenDays=${Jwt__RefreshTokenDays}
      - DOTNET_USE_POLLING_FILE_WATCHER=${DOTNET_USE_POLLING_FILE_WATCHER}
      - FileStorage__UploadsDirectory=${FileStorage__UploadsDirectory}
      - ExternalProviders__Auth0__Authority=${ExternalProviders__Auth0__Authority:-}
      - ExternalProviders__Auth0__ClientId=${ExternalProviders__Auth0__ClientId:-}
      - ExternalProviders__Auth0__Audience=${ExternalProviders__Auth0__Audience:-}
      - ExternalProviders__Google__ClientId=${ExternalProviders__Google__ClientId:-}
      - ExternalProviders__Google__ClientSecret=${ExternalProviders__Google__ClientSecret:-}
      - Email__UseFileOutput=${Email__UseFileOutput:-true}
      - Email__FromAddress=${Email__FromAddress:-noreply@bankstatements.app}
      - Email__FromName=${Email__FromName:-Bank Statements}
      - Email__SmtpHost=${Email__SmtpHost:-localhost}
      - Email__SmtpPort=${Email__SmtpPort:-587}
      - Email__SmtpUsername=${Email__SmtpUsername:-}
      - Email__SmtpPassword=${Email__SmtpPassword:-}
      - ClamAv__Host=${CLAMAV_HOST}
      - ClamAv__Port=${CLAMAV_PORT}
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=${RABBITMQ_DEFAULT_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_DEFAULT_PASS:-guest}
      - Basiq__ApiKey=${Basiq__ApiKey:-}
      - Basiq__ConsentRedirectUrl=${Basiq__ConsentRedirectUrl:-}
      - ASPNETCORE_HTTP_PORTS=
      - TZ=Australia/Sydney
    volumes:
      - ./backend/Statements.WebAPI:/app
      - ./backend/Uploads:/uploads
      - backend-bin:/app/bin
      - backend-obj:/app/obj

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_PROXY_TARGET=http://backend:5213
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
      - VITE_AUTH0_DOMAIN=${VITE_AUTH0_DOMAIN}
      - VITE_AUTH0_CLIENT_ID=${VITE_AUTH0_CLIENT_ID}

volumes:
  postgres-data:
  backend-bin:
  backend-obj:
  pgadmin-data:
  clamav-db:
  rabbitmq-data:
