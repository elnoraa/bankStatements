services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    depends_on:
      - db
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  backend:
    build: ./backend
    ports:
      - "5213:5213"
    depends_on:
      - db
    environment:
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      - Jwt__Issuer=${Jwt__Issuer}
      - Jwt__Audience=${Jwt__Audience}
      - Jwt__Secret=${Jwt__Secret}
      - Jwt__AccessTokenMinutes=${Jwt__AccessTokenMinutes}
      - Jwt__RefreshTokenDays=${Jwt__RefreshTokenDays}
      - DOTNET_USE_POLLING_FILE_WATCHER=${DOTNET_USE_POLLING_FILE_WATCHER}
      - FileStorage__UploadsDirectory=${FileStorage__UploadsDirectory}
      - ExternalProviders__Auth0__Authority=${ExternalProviders__Auth0__Authority:-}
      - ExternalProviders__Auth0__ClientId=${ExternalProviders__Auth0__ClientId:-}
      - ExternalProviders__Auth0__Audience=${ExternalProviders__Auth0__Audience:-}
      - ExternalProviders__Google__ClientId=${ExternalProviders__Google__ClientId:-}
      - ExternalProviders__Google__ClientSecret=${ExternalProviders__Google__ClientSecret:-}
    volumes:
      - ./backend/Statements.WebAPI:/app
      - ./backend/Uploads:/uploads
      - backend-bin:/app/bin
      - backend-obj:/app/obj

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_PROXY_TARGET=http://backend:5213
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
      - VITE_AUTH0_DOMAIN=${VITE_AUTH0_DOMAIN}
      - VITE_AUTH0_CLIENT_ID=${VITE_AUTH0_CLIENT_ID}

volumes:
  postgres-data:
  backend-bin:
  backend-obj:
  pgadmin-data:
