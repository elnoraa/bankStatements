version: '3.8'

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: bankdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "5000:80"
    depends_on:
      - db
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=bankdb;Username=user;Password=password

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend